name: flux_http
description: >
  A configurable, multi-environment, multi-backend HTTP client for Dart and Flutter.
  Returns Either<FluxFailure, T> without boilerplate. No codegen required.
version: 0.1.1
repository: https://github.com/IgnacioMan1998/flux_http

topics:
  - http
  - networking
  - dio
  - either
  - clean-architecture

environment:
  sdk: ^3.5.0

dependencies:
  dio: ^5.8.0+1
  http: ^1.4.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.6
